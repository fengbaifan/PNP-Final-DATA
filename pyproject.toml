[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrons-and-painters-knowledge-distillation"
version = "0.1.0"
description = "Evidence-traceable knowledge distillation system for Patrons and Painters: Italian art and society in the age of the Baroque"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
research = [
  "pdfplumber>=0.11",
  "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
# 本项目不是 Python 库（脚本经 sys.path/命名空间导入），禁止 flat-layout 自动发现，
# 避免 release/portable 被误判为顶层包导致 pip install -e 失败。
packages = []
