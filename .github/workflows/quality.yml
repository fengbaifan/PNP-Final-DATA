name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Normalize governed Git checkout
        run: |
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          git config --unset-all remote.origin.fetch || true
          git config --add remote.origin.fetch "+refs/heads/main:refs/remotes/origin/main"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run complete repository closure
        run: python scripts/run_sync_closure.py --refresh-generated --full --check-generated
